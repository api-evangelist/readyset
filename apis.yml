name: ReadySet
description: >-
  Readyset is a realtime SQL caching engine for Postgres and MySQL. It sits between
  applications and the database as a wire-compatible proxy, automatically caching the
  results of costly SELECT queries and keeping them up to date from the database
  replication stream with no application code changes or manual invalidation. Written
  in Rust and available as open source (BSL 1.1), a self-managed Private deployment,
  and a fully managed Readyset Cloud offering on AWS, it also ships Readyset AI — an
  MCP server plus the rdst diagnostics CLI — so AI assistants and developers can
  inspect caches, analyze slow queries, and deploy caches directly. Backed by Amplify
  Partners and Index Ventures.
